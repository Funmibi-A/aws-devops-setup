version: 0.2

env:
  variables:
    APP_ENV: "ci"
    NODE_ENV: "test"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies"
      - npm install
  pre_build:
    commands:
      - echo "Running tests"
      - npm test
  build:
    commands:
      - echo "Build started"
      - npm run build
  post_build:
    commands:
      - echo "Build finished"

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - '.git/**/*'
  name: ci-demo-build
